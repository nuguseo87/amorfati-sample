<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>아모르파티 — 회원신청 관리</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#F6F1E6;color:#241D12;padding:18px}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:19px;margin-bottom:4px}.sub{font-size:12.5px;color:#5A5044;margin-bottom:18px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
button{font:inherit;cursor:pointer;border:1px solid #C0A063;background:#fff;color:#241D12;
 padding:8px 14px;border-radius:3px;font-size:13px}
button.on{background:#241D12;color:#fff;border-color:#241D12}
button.ok{border-color:#0b7a3b;color:#0b7a3b}button.no{border-color:#b3261e;color:#b3261e}
input{font:inherit;padding:9px 12px;border:1px solid #d8cdb5;border-radius:3px;width:100%;max-width:340px}
.card{background:#fff;border:1px solid #E4D9C4;border-radius:4px;padding:14px 16px;margin-bottom:10px}
.card h3{font-size:15px;margin-bottom:6px}
.meta{font-size:12.5px;color:#5A5044;line-height:1.8}
.meta b{color:#241D12}
.memo{font-size:12.5px;background:#FAF7EF;border-left:2px solid #C0A063;padding:8px 10px;margin:8px 0;white-space:pre-wrap}
.act{display:flex;gap:8px;margin-top:10px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;margin-left:6px}
.tag.pending{background:#FFF3D6;color:#8A6428}.tag.approved{background:#E3F5EA;color:#0b7a3b}
.tag.rejected{background:#FBE6E4;color:#b3261e}
.empty{text-align:center;color:#8A7B63;padding:40px 0;font-size:13.5px}
</style></head><body><div class="wrap">
<h1>아모르파티 — FOUNDERS 100 신청 관리</h1>
<div class="sub">승인하면 결제 안내를 진행합니다. 개인정보는 신청 처리 후 1년까지만 보관합니다.</div>
<div id="auth"><input id="tok" type="password" placeholder="관리자 토큰" autocomplete="current-password">
 <button onclick="save()" style="margin-top:8px">확인</button></div>
<div id="app" hidden>
 <div class="bar">
  <button data-s="pending" class="on" onclick="load('pending',this)">대기</button>
  <button data-s="approved" onclick="load('approved',this)">승인</button>
  <button data-s="rejected" onclick="load('rejected',this)">반려</button>
  <button data-s="all" onclick="load('all',this)">전체</button>
  <span id="cnt" style="font-size:12.5px;color:#5A5044;align-self:center;margin-left:6px"></span>
 </div>
 <div id="list"></div>
</div>
<script>
let T = sessionStorage.getItem('afTok') || '';
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function save(){ T = document.getElementById('tok').value.trim();
  sessionStorage.setItem('afTok', T); load('pending', document.querySelector('[data-s=pending]')); }
async function api(p, o={}){ return fetch(p, {...o, headers:{...(o.headers||{}), 'X-Admin-Token':T,
  'Content-Type':'application/json'}}); }
async function load(s, btn){
  const r = await api('/api/admin/applications?status='+s);
  if(r.status===401){ alert('토큰이 올바르지 않습니다.'); return; }
  document.getElementById('auth').hidden = true; document.getElementById('app').hidden = false;
  document.querySelectorAll('.bar button').forEach(b=>b.classList.remove('on'));
  btn && btn.classList.add('on');
  const d = await r.json();
  document.getElementById('cnt').textContent =
    (d.counts||[]).map(c=>c.status+' '+c.n).join(' · ');
  const L = document.getElementById('list');
  if(!d.items.length){ L.innerHTML='<div class="empty">해당하는 신청이 없습니다.</div>'; return; }
  L.innerHTML = d.items.map(i => `<div class="card">
    <h3>${esc(i.name)}<span class="tag ${i.status}">${i.status}</span></h3>
    <div class="meta"><b>연락처</b> ${esc(i.phone)} &nbsp;·&nbsp; <b>이메일</b> ${esc(i.email)}<br>
      <b>신청</b> ${esc((i.created_at||'').replace('T',' ').slice(0,16))}
      ${i.reviewed_at ? ' &nbsp;·&nbsp; <b>처리</b> '+esc(i.reviewed_at.replace('T',' ').slice(0,16)) : ''}</div>
    ${i.memo ? '<div class="memo">'+esc(i.memo)+'</div>' : ''}
    <div class="act">
      <button class="ok" onclick="decide(${i.id},'approve')">승인</button>
      <button class="no" onclick="decide(${i.id},'reject')">반려</button>
      ${i.status!=='pending' ? '<button onclick="decide('+i.id+`,'reset')">대기로</button>` : ''}
    </div></div>`).join('');
}
async function decide(id, action){
  if(action==='reject' && !confirm('반려 처리할까요?')) return;
  await api('/api/admin/decide', {method:'POST', body:JSON.stringify({id, action})});
  const cur = document.querySelector('.bar button.on');
  load(cur.dataset.s, cur);
}
if(T) load('pending', document.querySelector('[data-s=pending]'));
</script></div></body></html>
